[project]
name = "life-weather"
version = "2.0.0"
description = "Vedic astrology (sidereal, Lahiri): Life Weather timeline, houses over time, and a South-Indian chart — every number from a stated classical rule"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pyswisseph>=2.10",
    "plotly>=5.24",
    "pandas>=2.0",
    "numpy>=1.26",
    "geonamescache>=3.0.2",
    "tzdata>=2026.2",
    "fpdf2>=2.9.0",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyright",
    "pytest>=8",
    "pypdf>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["life_weather"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
